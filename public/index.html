<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d17"><title>Mizanora</title>
<style>:root{--bg:#0b0d17;--c:#141831;--c2:#1b2040;--t:#eef0ff;--m:#8f97c7;--a:#7c5cff;--b:#22d3ee;--g:#4ade80;--r:#fb7185}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:radial-gradient(900px 500px at 0 -10%,#2a1f6b66,transparent),radial-gradient(700px 400px at 100% 0,#0e749044,transparent),var(--bg);color:var(--t);min-height:100vh;padding-bottom:78px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#0f1226ee;backdrop-filter:blur(14px);border-top:1px solid #ffffff14;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:9}nav button{background:none;color:var(--m);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border:0}nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--t)}nav button.on i{filter:drop-shadow(0 0 8px var(--a))}
.w{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{margin:0;font-size:22px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}h3{margin:0 0 10px}
.card{background:linear-gradient(160deg,var(--c),var(--c2));border:1px solid #ffffff14;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px #0006}.ad{background:linear-gradient(120deg,#7c5cff,#22d3ee);color:#fff;border:0}.ad a{color:#fff;font-weight:700}
button.p,.btn{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer}button.g{background:#ffffff14;border:0;color:var(--t);padding:8px 12px;border-radius:10px;cursor:pointer}
input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #ffffff22;background:#0b0d17;color:var(--t);margin:4px 0 10px;font:inherit}label{color:var(--m);font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.pill{padding:2px 10px;border-radius:99px;background:#ffffff14;font-size:12px}.ok{color:var(--g)}.bad{color:var(--r)}pre{background:#0b0d17;padding:10px;border-radius:12px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.hero{text-align:center;padding:90px 10px}.hero h1{font-size:44px}.bub{padding:8px 12px;border-radius:14px;margin:4px 0;max-width:85%}.in{background:#ffffff12}.out{background:#7c5cff55;margin-left:auto}.stat{font-size:28px;font-weight:700}</style></head><body><div class="w" id="app"></div><nav id="nav"></nav>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,getDocs,query,where,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAWiUQO3iFAYPVQcavr7a7dzIg8xEOxM7o",authDomain:"mizanor-ai-agent.firebaseapp.com",projectId:"mizanor-ai-agent",storageBucket:"mizanor-ai-agent.firebasestorage.app",messagingSenderId:"477247132816",appId:"1:477247132816:web:ec35ed53e7ee2a617d3415"});
const auth=getAuth(app),db=getFirestore(app),$=document.getElementById('app'),NAV=document.getElementById('nav');let U,me={},biz={},tab='home',isAdmin=false;
const $v=(id)=>document.getElementById(id)?.value??'',$c=(id)=>document.getElementById(id)?.checked;const rnd=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
const KEYS=[['WHATSAPP_AGENT_API_KEY','WhatsApp Agent API key'],['TELEGRAM_BOT_TOKEN','Telegram bot token'],['GEMINI_API_KEYS','Gemini key(s), comma separated'],['GROQ_API_KEYS','Groq key(s)'],['OPENAI_API_KEYS','OpenAI'],['OPENROUTER_API_KEYS','OpenRouter'],['MISTRAL_API_KEYS','Mistral'],['DEEPSEEK_API_KEYS','DeepSeek'],['TAVILY_API_KEY','Tavily (search)']];
const wf=(uid,ch)=>`name: agent-${uid.slice(0,8)}-${ch}
on: { workflow_dispatch: {}, schedule: [{ cron: '*/30 * * * *' }] }
concurrency: { group: agent-${uid}-${ch}, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils && pip install --user --break-system-packages -q edge-tts && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: npm install --no-audit --no-fund
      - run: node scripts/load-config.js ${uid} >> $GITHUB_ENV
        env: { FIREBASE_SERVICE_ACCOUNT: \${{ secrets.FIREBASE_SERVICE_ACCOUNT }} }
      - run: MAX_RUNTIME_MIN=340 node src/index.js
        env: { FIREBASE_SERVICE_ACCOUNT: \${{ secrets.FIREBASE_SERVICE_ACCOUNT }}, AGENT_UID: ${uid}, CHANNEL: ${ch}, MEMORY_DIR: memory_store/${uid}-${ch} }
`;
const gh=async(c,p,o={})=>{const r=await fetch('https://api.github.com/repos/'+c.repo+p,{...o,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'}});return r};
async function cfg(){return (await getDoc(doc(db,'admin/config'))).data()||{}}
async function load(){const r=doc(db,'users/'+U.uid);let s=await getDoc(r);if(!s.exists()){await setDoc(r,{email:U.email,name:U.displayName||'',status:'new',created:Date.now(),channels:[],cfg:{},news:false});s=await getDoc(r)}me=s.data();biz=(await getDoc(doc(db,'biz/'+U.uid))).data()||{};isAdmin=false;try{await getDoc(doc(db,'admin/config'));isAdmin=true}catch{}draw()}
const T=(t)=>{tab=t;draw()};window.T=T;window.go=()=>signInWithPopup(auth,new GoogleAuthProvider());window.out=()=>signOut(auth);
window.saveAgent=async()=>{const c={...me.cfg};KEYS.forEach(([k])=>{const v=$v(k).trim();if(v)c[k]=v});const ch=['whatsapp','telegram','business'].filter(x=>$c('c_'+x));await updateDoc(doc(db,'users/'+U.uid),{cfg:c,channels:ch,news:$c('news')});alert('Saved ✅');load()};
window.reqDeploy=async()=>{await updateDoc(doc(db,'users/'+U.uid),{status:'pending'});load()};
window.saveBiz=async()=>{const b={owner:U.uid,name:$v('b_name'),about:$v('b_about'),hours:$v('b_hours'),catalog:$v('b_cat'),buttons:$v('b_btn').split(',').map(x=>x.trim()).filter(Boolean).slice(0,3),phoneId:$v('b_pid'),token:$v('b_tok')||biz.token||'',appSecret:$v('b_sec')||biz.appSecret||'',verifyToken:biz.verifyToken||rnd()};await setDoc(doc(db,'biz/'+U.uid),b);await setDoc(doc(db,'bizPublic/'+U.uid),{verifyToken:b.verifyToken,name:b.name});alert('Business saved ✅');load()};
window.release=async(id)=>{await deleteDoc(doc(db,'handover/'+id));draw()};
window.approve=async(uid)=>{const c=await cfg();if(!c.token||!c.repo)return alert('Pehle Admin → Settings mein GitHub token/repo save karein');const u=(await getDoc(doc(db,'users/'+uid))).data(),res=[];for(const ch of(u.channels?.length?u.channels:['whatsapp'])){const f=`.github/workflows/agent-${uid.slice(0,8)}-${ch}.yml`,ex=await gh(c,'/contents/'+f),sha=ex.ok?(await ex.json()).sha:undefined;const w=await gh(c,'/contents/'+f,{method:'PUT',body:JSON.stringify({message:'agent '+uid+' '+ch,content:btoa(unescape(encodeURIComponent(wf(uid,ch)))),sha,branch:c.branch||'main'})});if(!w.ok){return alert('GitHub error: '+(await w.text()).slice(0,200))}await new Promise(r=>setTimeout(r,2500));await gh(c,`/actions/workflows/${f.split('/').pop()}/dispatches`,{method:'POST',body:JSON.stringify({ref:c.branch||'main'})});res.push(ch)}await updateDoc(doc(db,'users/'+uid),{status:'approved'});alert('Workflow chal gaye: '+res.join(', '));draw()};
window.reject=async(uid)=>{await updateDoc(doc(db,'users/'+uid),{status:'rejected'});draw()};
window.saveGh=async()=>{await setDoc(doc(db,'admin/config'),{token:$v('g_tok'),repo:$v('g_repo'),branch:$v('g_br')||'main'});alert('Saved ✅')};
window.addAd=async()=>{await addDoc(collection(db,'ads'),{title:$v('a_t'),text:$v('a_x'),link:$v('a_l'),at:Date.now()});draw()};window.delAd=async(id)=>{await deleteDoc(doc(db,'ads/'+id));draw()};
const ago=(t)=>t?Math.round((Date.now()-t)/60000)+' min pehle':'—';const live=(ch)=>me.beat?.[ch]&&Date.now()-me.beat[ch]<150000;
async function draw(){if(!U){NAV.innerHTML='';$.innerHTML='<div class="hero"><h1>Mizanora</h1><p style="color:var(--m)">Apna WhatsApp · Telegram · Business AI agent — apni keys, apna workflow.</p><button class="p" onclick="go()">Google se login</button></div>';return}
const tabs=[['home','🏠','Home'],['agent','🤖','Agent'],['biz','🏪','Business'],['chats','💬','Chats']].concat(isAdmin?[['admin','🛠️','Admin']]:[]);
NAV.innerHTML=tabs.map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="T('${k}')"><i>${i}</i>${l}</button>`).join('');
let h=`<div class="top"><h1>Mizanora</h1><div><span class="pill">${U.email}</span> <button class="g" onclick="out()">Logout</button></div></div>`;
if(tab=='home'){const ads=(await getDocs(collection(db,'ads'))).docs.map(d=>d.data());h+=ads.map(a=>`<div class="card ad"><b>${a.title}</b><br>${a.text} ${a.link?`<a target=_blank href="${a.link}">Dekhein →</a>`:''}</div>`).join('')+`<div class="card"><h3>Status</h3><span class="pill ${me.status=='approved'?'ok':''}">${me.status}</span> ${['new','rejected'].includes(me.status)?'<button class="p" onclick="reqDeploy()">Deploy request bhejein</button>':''}<p style="color:var(--m)">Pehle Agent / Business tab mein keys bharein, phir request bhejein. Admin approve karega to aap ka alag workflow chal padega.</p>${['whatsapp','telegram','business'].map(c=>`<p>${c}: ${live(c)?'<span class=ok>● live</span>':'<span class=bad>● offline</span>'} <span class="pill">${ago(me.beat?.[c])}</span></p>`).join('')}</div>`}
if(tab=='agent')h+=`<div class="card"><h3>Channels</h3><label><input type=checkbox id=c_whatsapp style="width:auto" ${me.channels?.includes('whatsapp')?'checked':''}> WhatsApp Agent</label> &nbsp; <label><input type=checkbox id=c_telegram style="width:auto" ${me.channels?.includes('telegram')?'checked':''}> Telegram</label> &nbsp; <label><input type=checkbox id=c_business style="width:auto" ${me.channels?.includes('business')?'checked':''}> WhatsApp Business</label><br><label><input type=checkbox id=news style="width:auto" ${me.news?'checked':''}> 📺 Mizanora News video (7am + 8pm)</label></div><div class="card"><h3>API keys</h3><p style="color:var(--m);font-size:13px">Sirf aap (aur admin) parh sakte hain. Khali chhorein to purani key rahegi.</p>${KEYS.map(([k,l])=>`<label>${l} ${me.cfg?.[k]?'<span class=ok>✓ saved</span>':''}</label><input id="${k}" type=password autocomplete=off>`).join('')}<button class="p" onclick="saveAgent()">Save</button></div>`;
if(tab=='biz')h+=`<div class="card"><h3>🏪 Business profile</h3><label>Business naam</label><input id=b_name value="${biz.name||''}"><label>Business ke baare mein + AI ke rules (policies, delivery, payment, kya nahi karna)</label><textarea id=b_about rows=5>${biz.about||''}</textarea><div class=row><div><label>Timings</label><input id=b_hours value="${biz.hours||''}" placeholder="Mon-Sat 10am-8pm"></div><div><label>Buttons (max 3, comma)</label><input id=b_btn value="${(biz.buttons||[]).join(', ')}" placeholder="Menu, Order status, Insaan se baat"></div></div><label>Catalog (har line: item | price)</label><textarea id=b_cat rows=5>${biz.catalog||''}</textarea></div><div class="card"><h3>Meta WhatsApp Cloud API</h3><label>Phone number ID</label><input id=b_pid value="${biz.phoneId||''}"><label>Permanent access token ${biz.token?'<span class=ok>✓</span>':''}</label><input id=b_tok type=password><label>App Secret ${biz.appSecret?'<span class=ok>✓</span>':''}</label><input id=b_sec type=password><button class="p" onclick="saveBiz()">Save business</button>${biz.verifyToken?`<p>Meta → Webhooks mein ye daalein:</p><pre>Callback URL: ${location.origin}/api/wa-webhook?biz=${U.uid}\nVerify token: ${biz.verifyToken}\nSubscribe: messages</pre>`:'<p style="color:var(--m)">Save karne par webhook URL aur verify token yahan aayenge.</p>'}</div>`;
if(tab=='chats'){const cs=(await getDocs(query(collection(db,'chats'),where('uid','==',U.uid),limit(200)))).docs.map(d=>d.data()).sort((x,y)=>x.at-y.at).slice(-40);const hv=(await getDocs(query(collection(db,'handover'),where('uid','==',U.uid)))).docs;h+=hv.length?`<div class="card"><h3>🙋 Insaan chahiye</h3>${hv.map(d=>`<p>${d.data().name||''} +${d.data().from} <button class=g onclick="release('${d.id}')">AI ko wapas dein</button></p>`).join('')}</div>`:'';h+=`<div class="card"><h3>Recent chats</h3>${cs.map(c=>`<div class="bub ${c.dir}"><small style="color:var(--m)">${c.name||c.from}</small><br>${c.text.replace(/</g,'&lt;')}</div>`).join('')||'Abhi koi chat nahi.'}</div>`}
if(tab=='admin'&&isAdmin){const c=await cfg(),us=(await getDocs(collection(db,'users'))).docs,ads=(await getDocs(collection(db,'ads'))).docs;h+=`<div class="row"><div class="card"><div class="stat">${us.length}</div>users</div><div class="card"><div class="stat">${us.filter(d=>d.data().status=='approved').length}</div>live</div><div class="card"><div class="stat">${us.filter(d=>d.data().status=='pending').length}</div>pending</div></div><div class="card"><h3>Users</h3>${us.map(d=>{const x=d.data();return`<p>${x.email} <span class=pill>${x.status}</span> ${(x.channels||[]).join(',')} ${x.status=='pending'?`<button class=p onclick="approve('${d.id}')">Approve</button> <button class=g onclick="reject('${d.id}')">Reject</button>`:x.status=='approved'?`<button class=g onclick="approve('${d.id}')">Workflow dobara chalao</button>`:''}</p>`}).join('')}</div><div class="card"><h3>📣 Ads / Marketing banners (sab users ko Home par)</h3>${ads.map(d=>`<p><b>${d.data().title}</b> ${d.data().text} <button class=g onclick="delAd('${d.id}')">✕</button></p>`).join('')}<input id=a_t placeholder="Title"><input id=a_x placeholder="Text"><input id=a_l placeholder="Link (optional)"><button class=p onclick="addAd()">Banner lagayein</button></div><div class="card"><h3>⚙️ GitHub settings</h3><label>Token (Contents, Actions, Workflows: RW)</label><input id=g_tok type=password value="${c.token||''}"><label>Repo (owner/name)</label><input id=g_repo value="${c.repo||''}"><label>Branch</label><input id=g_br value="${c.branch||'main'}"><button class=p onclick="saveGh()">Save</button></div>`}
$.innerHTML=h}
onAuthStateChanged(auth,u=>{U=u;u?load():draw()});
</script></body></html>
