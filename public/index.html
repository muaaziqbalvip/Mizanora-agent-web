<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mizanora Agent</title>
<style>:root{--bg:#0b0d17;--c:#151932;--t:#e8ebff;--m:#8f97c7;--a:#7c5cff;--b:#22d3ee}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:radial-gradient(900px 500px at 10% -10%,#2a1f6b55,transparent),radial-gradient(700px 400px at 100% 0,#0e7490444,transparent),var(--bg);color:var(--t);min-height:100vh}
.w{max-width:900px;margin:auto;padding:20px}h1{margin:0;font-size:22px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card{background:var(--c);border:1px solid #ffffff14;border-radius:16px;padding:18px;margin-bottom:14px}button{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}button.g{background:#ffffff14}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #ffffff22;background:#0b0d17;color:var(--t);margin:4px 0 10px}label{color:var(--m);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{padding:3px 10px;border-radius:99px;background:#ffffff14;font-size:12px}.ok{color:#4ade80}code,pre{background:#0b0d17;padding:10px;border-radius:10px;display:block;overflow:auto;font-size:12px}.hero{text-align:center;padding:80px 10px}</style></head><body><div class="w" id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyAWiUQO3iFAYPVQcavr7a7dzIg8xEOxM7o",authDomain:"mizanor-ai-agent.firebaseapp.com",projectId:"mizanor-ai-agent",storageBucket:"mizanor-ai-agent.firebasestorage.app",messagingSenderId:"477247132816",appId:"1:477247132816:web:ec35ed53e7ee2a617d3415"});
const auth=getAuth(app),$=document.getElementById('app');let me={},tab='agent',user;
const api=async(p,b)=>{const t=await user.getIdToken();const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{authorization:'Bearer '+t,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()};
const F=[['WHATSAPP_AGENT_API_KEY','WhatsApp Agent API key'],['TELEGRAM_BOT_TOKEN','Telegram bot token'],['GEMINI_API_KEYS','Gemini key(s), comma separated'],['GROQ_API_KEYS','Groq key(s)'],['OPENAI_API_KEYS','OpenAI'],['OPENROUTER_API_KEYS','OpenRouter'],['MISTRAL_API_KEYS','Mistral'],['DEEPSEEK_API_KEYS','DeepSeek'],['TAVILY_API_KEY','Tavily (search)']];
window.go=async()=>{await signInWithPopup(auth,new GoogleAuthProvider())};window.out=()=>signOut(auth);window.T=(t)=>{tab=t;draw()};
window.save=async()=>{const keys={};F.forEach(([k])=>keys[k]=document.getElementById(k).value);const channels=['whatsapp','telegram'].filter(c=>document.getElementById('c_'+c).checked);await api('save',{keys,channels,news:document.getElementById('news').checked});alert('Saved (encrypted) ✅');load()};
window.req=async()=>{await api('request',{});load()};window.ap=async(u)=>{const r=await api('admin/approve',{uid:u});alert(JSON.stringify(r));draw()};window.rj=async(u)=>{await api('admin/reject',{uid:u});draw()};
async function load(){me=await api('me');draw()}
async function draw(){if(!user){$.innerHTML='<div class="hero"><h1 style="font-size:40px">Mizanora Agent</h1><p style="color:var(--m)">Apna WhatsApp / Telegram AI agent, apni keys, apna workflow.</p><button onclick="go()">Google se login</button></div>';return}
let h=`<div class="top"><h1>Mizanora</h1><div><span class="pill">${me.email||''}</span> <button class="g" onclick="out()">Logout</button></div></div><div class="tabs">${['agent','logs','api'].concat(me.isAdmin?['admin']:[]).map(t=>`<button class="${t==tab?'':'g'}" onclick="T('${t}')">${t}</button>`).join('')}</div>`;
if(tab=='agent'){h+=`<div class="card"><b>Status:</b> <span class="pill ${me.status=='approved'?'ok':''}">${me.status}</span> ${me.status!='approved'&&me.status!='pending'?'<button onclick="req()">Deploy request bhejein</button>':''}<p style="color:var(--m)">Keys server par AES-256 encrypted save hoti hain; wapas dikhai nahi jaati (sirf ✓).</p>
<label><input type="checkbox" id="c_whatsapp" style="width:auto" ${me.channels.includes('whatsapp')?'checked':''}> WhatsApp</label> <label><input type="checkbox" id="c_telegram" style="width:auto" ${me.channels.includes('telegram')?'checked':''}> Telegram</label> <label><input type="checkbox" id="news" style="width:auto" ${me.news?'checked':''}> Mizanora News video (7am + 8pm)</label><hr style="border-color:#ffffff14">`+F.map(([k,l])=>`<label>${l} ${me.have.includes(k)?'<span class=ok>✓ saved</span>':''}</label><input id="${k}" type="password" placeholder="${me.have.includes(k)?'••••• (khali = purani rahe)':''}">`).join('')+`<button onclick="save()">Save</button></div>`}
if(tab=='logs'){const l=await api('logs');h+='<div class="card">'+((l.runs||[]).map(r=>`<p><span class="pill">${r.status}${r.conclusion?' · '+r.conclusion:''}</span> ${r.name} — ${new Date(r.at).toLocaleString()} <a style="color:var(--b)" target=_blank href="${r.url}">logs</a></p>`).join('')||'Abhi koi run nahi.')+'</div>'}
if(tab=='api')h+=`<div class="card"><b>Website search API</b><p style="color:var(--m)">Apni site par search lagayein (aap ki Gemini key use hoti hai):</p><pre>fetch('${location.origin}/api/search?q=' + encodeURIComponent(query) + '&key=${me.siteKey||'(pehle Save karein)'}').then(r=>r.json())</pre></div>`;
if(tab=='admin'){const u=await api('admin/list');h+='<div class="card">'+u.map(x=>`<p>${x.email} <span class="pill">${x.status}</span> ${x.channels.join(',')} ${x.status=='pending'?`<button onclick="ap('${x.uid}')">Approve + workflow banao</button> <button class="g" onclick="rj('${x.uid}')">Reject</button>`:''}</p>`).join('')+'</div>'}
$.innerHTML=h}
onAuthStateChanged(auth,u=>{user=u;u?load():draw()});
</script></body></html>
